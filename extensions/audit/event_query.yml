---
# Indirect node counting query for the cisco.intersight collection.
#
# This jq runs inside the Automation Platform controller
# (awx/main/tasks/host_indirect.py) against each module's result, and its output
# feeds subscription node counting. Nothing in this repository executes it, so
# tests/unit/audit/test_event_query_contract.py asserts the contract the
# controller imposes on the output.
#
# canonical_facts is the ONLY key the controller deduplicates on --
# `results[hashable_facts]` -- and `facts` and `name` are taken from the first
# record seen. So canonical_facts must hold identity and nothing else. `Name` is
# user-editable in Intersight; while it was in canonical_facts, renaming a
# policy or pool produced a second audit row for the same object. Moid is the
# immutable identifier and is sufficient on its own.
#
# canonical_facts also cannot contain null at any depth: get_hashable_form()
# accepts int/float/str/bool/dict/list/tuple and raises UnhashableFacts on
# anything else, so a null field discards the whole record, silently, with the
# job green. The select() below proves both Moid and ObjectType are non-null.
cisco.intersight.*:
  query: >-
    (
      {
        "access.Policy": "networking",
        "asset.Target": "security_identity",
        "bios.Policy": "compute",
        "boot.PrecisionPolicy": "compute",
        "fabric.PortPolicy": "networking",
        "fabric.EthNetworkPolicy": "networking",
        "fabric.FcNetworkPolicy": "networking",
        "fabric.EthNetworkGroupPolicy": "networking",
        "fabric.EthNetworkControlPolicy": "networking",
        "fabric.LinkControlPolicy": "networking",
        "fabric.MulticastPolicy": "networking",
        "fabric.SystemQosPolicy": "networking",
        "fabric.FcZonePolicy": "networking",
        "vnic.VnicTemplate": "networking",
        "vnic.VhbaTemplate": "networking",
        "vnic.LanConnectivityPolicy": "networking",
        "vnic.SanConnectivityPolicy": "networking",
        "vnic.EthAdapterPolicy": "networking",
        "vnic.FcAdapterPolicy": "networking",
        "vnic.EthQosPolicy": "networking",
        "vnic.FcQosPolicy": "networking",
        "vnic.FcNetworkPolicy": "networking",
        "vnic.IscsiAdapterPolicy": "networking",
        "vnic.IscsiBootPolicy": "networking",
        "vnic.IscsiStaticTargetPolicy": "networking",
        "vmedia.Policy": "storage",
        "macpool.Pool": "networking",
        "fcpool.Pool": "networking",
        "iam.EndPointUserPolicy": "security_identity",
        "iqnpool.Pool": "networking",
        "ippool.Pool": "networking",
        "uuidpool.Pool": "compute",
        "storage.StoragePolicy": "storage",
        "power.Policy": "compute",
        "thermal.Policy": "compute",
        "kvm.Policy": "compute",
        "ipmioverlan.Policy": "monitoring",
        "ntp.Policy": "networking",
        "snmp.Policy": "monitoring",
        "syslog.Policy": "monitoring",
        "networkconfig.Policy": "networking",
        "firmware.Policy": "compute"
      } as $mapping |
      {
        "access": "network_policy",
        "asset": "asset_target",
        "bios": "bios_policy",
        "boot": "boot_policy",
        "fabric": "fabric_policy",
        "vnic": "network_interface_policy",
        "vmedia": "virtual_media",
        "macpool": "mac_pool",
        "fcpool": "fc_pool",
        "iam": "iam",
        "iqnpool": "iqn_pool",
        "ippool": "ip_pool",
        "uuidpool": "uuid_pool",
        "storage": "storage_policy",
        "power": "power_policy",
        "thermal": "thermal_policy",
        "kvm": "kvm_policy",
        "ipmioverlan": "ipmi_policy",
        "ntp": "ntp_policy",
        "snmp": "snmp_policy",
        "syslog": "syslog_policy",
        "networkconfig": "network_config_policy",
        "firmware": "firmware_policy"
      } as $device_type_mapping |
      (.api_response ) |
      (if type=="array" then .[]
        else if type=="object" then .
              else empty end
       end
       ) as $data |
        select($data.Moid != null and $data.ObjectType != null) |
        {
          name: ($data.Name // $data.Moid),
          canonical_facts: {
            id: $data.Moid,
            node_type: $data.ObjectType
          },
          facts: {
            infra_type: "private_cloud",
            infra_bucket: ($mapping[$data.ObjectType] // "unknown"),
            device_type: (($data.ObjectType | split(".")[0]) as $dt | ($device_type_mapping[$dt] // $dt)),
            name: ($data.Name // "UNKNOWN")
          }
        }
    )
